[package]
name = "spoplayer"
version = "0.1.42"
description = "SpoPlayer Desktop Music Player"
authors = ["FrancisQ221"]
edition = "2024"

[lib]
name = "spoplayer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
